name: Gerar APK

on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Compilar
        run: gradle assembleDebug

      - name: Renomear APK
        run: cp app/build/outputs/apk/debug/app-debug.apk SetasNaTela.apk

      - uses: actions/upload-artifact@v4
        with:
          name: SetasNaTela-apk
          path: SetasNaTela.apk

      - name: Publicar na página de Releases
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: SetasNaTela.apk
